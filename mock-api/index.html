<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Check Simulation</title>
    <!-- iPhone/PWA用のフルスクリーン設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Check Sim">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        #result {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #34d399;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Check Simulation</h1>
        <p>iPhoneのホーム画面からネイティブアプリ風に起動できるシンプル画面です。</p>
        <button id="checkBtn">動作確認</button>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('checkBtn').addEventListener('click', () => {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = "動作確認OK（PWA基本画面）";
        });
    </script>

</body>
</html>
